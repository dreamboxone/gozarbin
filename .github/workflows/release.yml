name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # The Windows desktop target, on the latest runner. x86_64 only: the
  # arm64 MSVC target has never been verified on a real arm64 Windows
  # machine. macOS is not built here.
  #
  # This leg builds the pluggable transports first and ships them in a
  # pt/ folder beside the binary, so tor works out of the box with
  # nothing for anyone to install by hand.
  # ------------------------------------------------------------------
  desktop:
    name: Build aether-windows-x86_64.zip
    runs-on: windows-latest
    env:
      TARGET: x86_64-pc-windows-msvc
      ARCHIVE: aether-windows-x86_64.zip
    defaults:
      run:
        working-directory: aether
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Match embedded version to release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: .
        run: bash scripts/set-release-version.sh "$GITHUB_REF_NAME"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # cache: false because there is no Go module here to key a cache on —
      # the transports are fetched by `go install`, so setup-go looks for a
      # go.sum that does not exist and warns on every run.
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.22"
          cache: false

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Install NASM
        uses: ilammy/setup-nasm@v1

      - name: Build pluggable transports
        shell: bash
        run: bash ../pt-build.sh windows amd64 "$PWD/pt"

      - name: Build release binary
        run: cargo build --release --features tor --target $env:TARGET

      - name: Package archive
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force pt target/$env:TARGET/release/pt
          Compress-Archive -Path target/$env:TARGET/release/aether.exe,target/$env:TARGET/release/pt,run-aether.bat -DestinationPath $env:ARCHIVE

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: aether-windows-x86_64.zip
          path: aether/aether-windows-x86_64.zip
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Linux targets, built inside the latest Fedora container.
  # x86_64 builds on an x86_64 runner and arm64 on a native arm64
  # runner, both using fedora:latest so binaries link against a fresh
  # Fedora toolchain. Rust is installed via rustup to guarantee the
  # latest stable (>= 1.98 required by the crate).
  # ------------------------------------------------------------------
  linux:
    name: Build ${{ matrix.archive }}
    runs-on: ${{ matrix.os }}
    container:
      image: fedora:latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            goos: linux
            goarch: amd64
            archive: aether-linux-x86_64.tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            goos: linux
            goarch: arm64
            archive: aether-linux-arm64.tar.gz
    defaults:
      run:
        working-directory: aether
    steps:
      - name: Install system dependencies (Fedora)
        working-directory: /
        run: |
          dnf -y install \
            gcc gcc-c++ make cmake ninja-build golang nasm clang \
            perl perl-FindBin perl-IPC-Cmd \
            curl git tar gzip xz unzip findutils which

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Match embedded version to release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: .
        run: bash scripts/set-release-version.sh "$GITHUB_REF_NAME"

      - name: Install Rust (latest stable via rustup)
        working-directory: /
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build pluggable transports
        run: bash ../pt-build.sh ${{ matrix.goos }} ${{ matrix.goarch }} "$PWD/pt"

      - name: Build release binary
        run: cargo build --release --features tor --target ${{ matrix.target }}

      - name: Package archive
        run: |
          cp -R pt target/${{ matrix.target }}/release/pt
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ matrix.archive }}  aether pt

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: aether/${{ matrix.archive }}
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 32-bit ARM (Raspberry Pi 2/3 class and older ARM boards).
  # Cross-compiled on the latest Ubuntu runner with the gnueabihf
  # toolchain, which ships the glibc hard-float cross compiler that
  # Fedora does not package cleanly. Best-effort, never blocks release.
  # ------------------------------------------------------------------
  linux-armv7:
    name: Build aether-linux-armv7.tar.gz
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aether
    env:
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
      CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
      CXX_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-g++
      AR_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-ar
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Match embedded version to release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: .
        run: bash scripts/set-release-version.sh "$GITHUB_REF_NAME"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabihf

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.22"
          cache: false

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Install ARM cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf

      - name: Build pluggable transports
        run: bash ../pt-build.sh linux arm "$PWD/pt" 7

      - name: Build release binary
        run: cargo build --release --features tor --target armv7-unknown-linux-gnueabihf

      - name: Package archive
        run: |
          cp -R pt target/armv7-unknown-linux-gnueabihf/release/pt
          cd target/armv7-unknown-linux-gnueabihf/release
          tar -czf ../../../aether-linux-armv7.tar.gz aether pt

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: aether-linux-armv7.tar.gz
          path: aether/aether-linux-armv7.tar.gz
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 32-bit ARM musl, fully static (OpenWrt routers and other musl-based
  # Linux systems). Built directly on the runner rather than with
  # `cross`/Docker: this repo isn't a single cargo workspace (aether
  # depends on ../quiche via path deps, and quiche has its own
  # [workspace]), and cross's container only mounts the crate being
  # built, so it can't see the referenced workspace root. Building on
  # the runner avoids that entirely.
  #
  # The musl toolchain comes from AmanoTeam/musl-gcc-cross's GitHub
  # release, not musl.cc, which blocks all requests from GitHub
  # Actions runners. Note the release asset is named by *host*
  # architecture, not target: x86_64-unknown-linux-gnu.tar.xz is the
  # x86_64-hosted toolchain that contains cross-compilers for every
  # target musl-gcc-cross supports, including armv7-musleabihf.
  #
  # boring-sys uses bindgen (backed by clang) to generate BoringSSL
  # bindings. Without BINDGEN_EXTRA_CLANG_ARGS pointing it at the musl
  # sysroot, clang falls back to the host's glibc headers, which don't
  # exist in the same layout musl expects (missing bits/libc-header-start.h).
  #
  # RUST_LIBC_UNSTABLE_MUSL_V1_2_3 tells the libc crate that this is a
  # modern musl (1.2.x, 64-bit time_t on 32-bit targets). Without it,
  # libc assumes the old 32-bit time_t, which doesn't match what
  # bindgen sees in the real (1.2.x) sysroot headers, and boring fails
  # to build with type mismatches on ASN1_TIME_set/X509_VERIFY_PARAM_set_time.
  # ------------------------------------------------------------------
  linux-armv7-musl:
    name: Build aether-linux-armv7-musl.tar.gz
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aether
    env:
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_LINKER: /opt/musl-cross/bin/armv7-unknown-linux-musleabihf-gcc
      CC_armv7_unknown_linux_musleabihf: /opt/musl-cross/bin/armv7-unknown-linux-musleabihf-gcc
      CXX_armv7_unknown_linux_musleabihf: /opt/musl-cross/bin/armv7-unknown-linux-musleabihf-g++
      AR_armv7_unknown_linux_musleabihf: /opt/musl-cross/bin/armv7-unknown-linux-musleabihf-ar
      BINDGEN_EXTRA_CLANG_ARGS_armv7_unknown_linux_musleabihf: --target=armv7-unknown-linux-musleabihf --sysroot=/opt/musl-cross/armv7-unknown-linux-musleabihf
      RUSTFLAGS: --cfg libc_unstable_musl_v1_2_3
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Match embedded version to release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: .
        run: bash scripts/set-release-version.sh "$GITHUB_REF_NAME"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-musleabihf

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.22"
          cache: false

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Install musl cross toolchain
        run: |
          curl -fsSL https://github.com/AmanoTeam/musl-gcc-cross/releases/download/gcc-15/x86_64-unknown-linux-gnu.tar.xz -o /tmp/musl-cross.tar.xz
          sudo mkdir -p /opt/musl-cross
          sudo tar -C /opt/musl-cross --strip-components=1 -xJf /tmp/musl-cross.tar.xz

      - name: Build pluggable transports
        run: bash ../pt-build.sh linux arm "$PWD/pt" 7

      - name: Build release binary
        run: cargo build --release --features tor --target armv7-unknown-linux-musleabihf

      - name: Package archive
        run: |
          cp -R pt target/armv7-unknown-linux-musleabihf/release/pt
          cd target/armv7-unknown-linux-musleabihf/release
          tar -czf ../../../aether-linux-armv7-musl.tar.gz aether pt

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: aether-linux-armv7-musl.tar.gz
          path: aether/aether-linux-armv7-musl.tar.gz
          if-no-files-found: error

  # ------------------------------------------------------------------
  # 64-bit x86 and arm64 musl, fully static. x86_64 covers OpenWrt on
  # x86_64 routers/boxes and any generic musl-based x86_64 Linux.
  # aarch64 covers OpenWrt on arm64 routers and Raspberry Pi 4/5 running
  # a musl userland. Same toolchain source and same bindgen/libc env
  # var fixes as linux-armv7-musl above, just different target triples.
  # ------------------------------------------------------------------
  linux-musl:
    name: Build ${{ matrix.archive }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aether
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            cross_prefix: x86_64-unknown-linux-musl
            goos: linux
            goarch: amd64
            archive: aether-linux-x86_64-musl.tar.gz
          - target: aarch64-unknown-linux-musl
            cross_prefix: aarch64-unknown-linux-musl
            goos: linux
            goarch: arm64
            archive: aether-linux-aarch64-musl.tar.gz
    env:
      RUST_LIBC_UNSTABLE_MUSL_V1_2_3: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Match embedded version to release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: .
        run: bash scripts/set-release-version.sh "$GITHUB_REF_NAME"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.22"
          cache: false

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Install musl cross toolchain
        run: |
          curl -fsSL https://github.com/AmanoTeam/musl-gcc-cross/releases/download/gcc-15/x86_64-unknown-linux-gnu.tar.xz -o /tmp/musl-cross.tar.xz
          sudo mkdir -p /opt/musl-cross
          sudo tar -C /opt/musl-cross --strip-components=1 -xJf /tmp/musl-cross.tar.xz

      - name: Set up cross env vars
        run: |
          triple=$(echo "${{ matrix.target }}" | tr '-' '_')
          prefix=/opt/musl-cross/bin/${{ matrix.cross_prefix }}
          echo "CARGO_TARGET_${triple^^}_LINKER=${prefix}-gcc" >> "$GITHUB_ENV"
          echo "CC_${triple}=${prefix}-gcc" >> "$GITHUB_ENV"
          echo "CXX_${triple}=${prefix}-g++" >> "$GITHUB_ENV"
          echo "AR_${triple}=${prefix}-ar" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS_${triple}=--target=${{ matrix.target }} --sysroot=/opt/musl-cross/${{ matrix.cross_prefix }}" >> "$GITHUB_ENV"

      - name: Build pluggable transports
        run: bash ../pt-build.sh ${{ matrix.goos }} ${{ matrix.goarch }} "$PWD/pt"

      - name: Build release binary
        run: cargo build --release --features tor --target ${{ matrix.target }}

      - name: Package archive
        run: |
          cp -R pt target/${{ matrix.target }}/release/pt
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ matrix.archive }} aether pt

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: aether/${{ matrix.archive }}
          if-no-files-found: error

  # ------------------------------------------------------------------
  # OpenWrt packages, every architecture the musl legs above produce a
  # binary for, in both package formats: 24.10 is opkg and gives .ipk,
  # 25.12 is apk and gives .apk.
  #
  # One entry per (release, package architecture). The target/subtarget
  # is only there to name an SDK — a package is built for an
  # architecture, but SDKs are published per target — and each was read
  # from that target's own profiles.json rather than remembered.
  #
  # The architectures absent from this list are MIPS, PowerPC and
  # big-endian ARM. Rust carries those as tier 3, so the core cannot be
  # built for them on a stable toolchain, and a router of that vintage
  # has nowhere near the flash for it anyway.
  # ------------------------------------------------------------------
  openwrt:
    name: ${{ matrix.format }} ${{ matrix.arch }}
    needs: [linux-armv7-musl, linux-musl]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { release: "24.10.8", format: ipk, arch: aarch64_cortex-a53, target: bcm27xx, subtarget: bcm2710, artifact: aether-linux-aarch64-musl.tar.gz }
          - { release: "24.10.8", format: ipk, arch: aarch64_cortex-a72, target: bcm27xx, subtarget: bcm2711, artifact: aether-linux-aarch64-musl.tar.gz }
          - { release: "24.10.8", format: ipk, arch: aarch64_cortex-a76, target: bcm27xx, subtarget: bcm2712, artifact: aether-linux-aarch64-musl.tar.gz }
          - { release: "24.10.8", format: ipk, arch: aarch64_generic, target: armsr, subtarget: armv8, artifact: aether-linux-aarch64-musl.tar.gz }
          - { release: "24.10.8", format: ipk, arch: arm_cortex-a15_neon-vfpv4, target: armsr, subtarget: armv7, artifact: aether-linux-armv7-musl.tar.gz }
          - { release: "24.10.8", format: ipk, arch: arm_cortex-a5_vfpv4, target: at91, subtarget: sama5, artifact: aether-linux-armv7-musl.tar.gz }
          - { release: "24.10.8", format: ipk, arch: arm_cortex-a7_neon-vfpv4, target: bcm27xx, subtarget: bcm2709, artifact: aether-linux-armv7-musl.tar.gz }
          - { release: "24.10.8", format: ipk, arch: arm_cortex-a7_vfpv4, target: at91, subtarget: sama7, artifact: aether-linux-armv7-musl.tar.gz }
          - { release: "24.10.8", format: ipk, arch: arm_cortex-a8_vfpv3, target: omap, subtarget: generic, artifact: aether-linux-armv7-musl.tar.gz }
          - { release: "24.10.8", format: ipk, arch: arm_cortex-a9_neon, target: imx, subtarget: cortexa9, artifact: aether-linux-armv7-musl.tar.gz }
          - { release: "24.10.8", format: ipk, arch: arm_cortex-a9_vfpv3-d16, target: mvebu, subtarget: cortexa9, artifact: aether-linux-armv7-musl.tar.gz }
          - { release: "24.10.8", format: ipk, arch: x86_64, target: x86, subtarget: "64", artifact: aether-linux-x86_64-musl.tar.gz }
          - { release: "25.12.5", format: apk, arch: aarch64_cortex-a53, target: bcm27xx, subtarget: bcm2710, artifact: aether-linux-aarch64-musl.tar.gz }
          - { release: "25.12.5", format: apk, arch: aarch64_cortex-a72, target: bcm27xx, subtarget: bcm2711, artifact: aether-linux-aarch64-musl.tar.gz }
          - { release: "25.12.5", format: apk, arch: aarch64_cortex-a76, target: bcm27xx, subtarget: bcm2712, artifact: aether-linux-aarch64-musl.tar.gz }
          - { release: "25.12.5", format: apk, arch: aarch64_generic, target: armsr, subtarget: armv8, artifact: aether-linux-aarch64-musl.tar.gz }
          - { release: "25.12.5", format: apk, arch: arm_cortex-a15_neon-vfpv4, target: armsr, subtarget: armv7, artifact: aether-linux-armv7-musl.tar.gz }
          - { release: "25.12.5", format: apk, arch: arm_cortex-a5_vfpv4, target: at91, subtarget: sama5, artifact: aether-linux-armv7-musl.tar.gz }
          - { release: "25.12.5", format: apk, arch: arm_cortex-a7_neon-vfpv4, target: bcm27xx, subtarget: bcm2709, artifact: aether-linux-armv7-musl.tar.gz }
          - { release: "25.12.5", format: apk, arch: arm_cortex-a7_vfpv4, target: at91, subtarget: sama7, artifact: aether-linux-armv7-musl.tar.gz }
          - { release: "25.12.5", format: apk, arch: arm_cortex-a8_vfpv3, target: omap, subtarget: generic, artifact: aether-linux-armv7-musl.tar.gz }
          - { release: "25.12.5", format: apk, arch: arm_cortex-a9_neon, target: imx, subtarget: cortexa9, artifact: aether-linux-armv7-musl.tar.gz }
          - { release: "25.12.5", format: apk, arch: arm_cortex-a9_vfpv3-d16, target: mvebu, subtarget: cortexa9, artifact: aether-linux-armv7-musl.tar.gz }
          - { release: "25.12.5", format: apk, arch: x86_64, target: x86, subtarget: "64", artifact: aether-linux-x86_64-musl.tar.gz }
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set package version from Git tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: bash scripts/set-release-version.sh "$GITHUB_REF_NAME"

      - name: Install SDK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync \
            unzip zlib1g-dev file wget zstd

      - name: Download the Aether binary
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: binary

      - name: Unpack the Aether binary
        run: |
          tar -xzf "binary/${{ matrix.artifact }}" -C binary
          chmod +x binary/aether
          file binary/aether

      - name: Download the OpenWrt SDK
        run: |
          base="https://downloads.openwrt.org/releases/${{ matrix.release }}/targets/${{ matrix.target }}/${{ matrix.subtarget }}"
          # The SDK file name carries a gcc version that moves between point
          # releases, so it is read out of the target's index rather than spelt
          # out here. 24.10 publishes .tar.xz, 25.12 .tar.zst.
          name=$(curl -fsSL "$base/sha256sums" | sed -n 's/.*\(openwrt-sdk-[^ ]*\.tar\.\(xz\|zst\)\)$/\1/p' | head -n 1)
          test -n "$name"
          echo "Using $name"
          curl -fsSL "$base/$name" -o /tmp/sdk.tar
          mkdir -p /tmp/sdk
          case "$name" in
            *.zst) tar --zstd -C /tmp/sdk --strip-components=1 -xf /tmp/sdk.tar ;;
            *)     tar -C /tmp/sdk --strip-components=1 -xJf /tmp/sdk.tar ;;
          esac

      - name: Build the packages
        run: |
          set -eux
          sdk=/tmp/sdk
          cp -a openwrt "$sdk/package/gozarbin"
          cp -a luci-app-gozarbin "$sdk/package/luci-app-gozarbin"
          cd "$sdk"
          make defconfig >/dev/null
          arch=$(awk -F= '/^CONFIG_TARGET_ARCH_PACKAGES=/{gsub(/"/, "", $2); print $2}' .config)
          # The SDK must agree with the matrix, or the wrong binary ships.
          test "$arch" = "${{ matrix.arch }}"
          mkdir -p "package/gozarbin/prebuilt/$arch"
          cp "$GITHUB_WORKSPACE/binary/aether" "package/gozarbin/prebuilt/$arch/aether"
          # The SDK selects every package by default. Clearing the selection and
          # asking for these two lets Kconfig pull in exactly their dependencies.
          sed -i 's/^CONFIG_ALL=y/# CONFIG_ALL is not set/' .config
          sed -i 's/^CONFIG_ALL_KMODS=y/# CONFIG_ALL_KMODS is not set/' .config
          sed -i 's/^CONFIG_ALL_NONSHARED=y/# CONFIG_ALL_NONSHARED is not set/' .config
          sed -i -E 's/^CONFIG_PACKAGE_([^=]+)=[ym]/# CONFIG_PACKAGE_\1 is not set/' .config
          printf '\nCONFIG_PACKAGE_gozarbin=m\nCONFIG_PACKAGE_luci-app-gozarbin=m\n' >> .config
          make defconfig >/dev/null
          make package/gozarbin/compile -j"$(nproc)" V=s
          make package/luci-app-gozarbin/compile -j"$(nproc)" V=s

      - name: Collect the packages
        id: collect
        run: |
          out="gozarbin-openwrt-${{ matrix.release }}-${{ matrix.arch }}"
          mkdir -p "$out"
          find /tmp/sdk/bin/packages -type f \
            \( -name 'gozarbin-*.apk' -o -name 'luci-app-gozarbin-*.apk' \
               -o -name 'gozarbin_*.ipk' -o -name 'luci-app-gozarbin_*.ipk' \) \
            -exec cp -f {} "$out/" \;
          ls -l "$out"
          # Two packages or the leg has not produced what it claims to.
          test "$(ls -1 "$out" | wc -l)" -ge 2
          tar -czf "$out.tar.gz" "$out"
          echo "archive=$out.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.collect.outputs.archive }}
          path: ${{ steps.collect.outputs.archive }}
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Collect every artifact, generate SHA-256 checksums and publish.
  # Runs even if some build legs failed, so one broken target never
  # blocks shipping the ones that succeeded.
  #
  # !cancelled() and not always(): always() also fires when the run was
  # cancelled, and cancelling is how a release that should not ship gets
  # stopped. It published one anyway once, out of whatever legs happened
  # to have finished by then.
  # ------------------------------------------------------------------
  release:
    name: Publish release
    needs: [desktop, linux, linux-armv7, linux-armv7-musl, linux-musl, openwrt]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          shopt -s nullglob
          files=(*.tar.gz *.zip)
          for f in "${files[@]}"; do
            sha256sum "$f" > "$f.sha256"
          done
          sha256sum "${files[@]}" > SHA256SUMS.txt
          echo "----- SHA256SUMS.txt -----"
          cat SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: dist/**/*
          body: |
            ## Gozarbin for OpenWrt

            Gozarbin finds a way out of a filtered network and hands it to the
            whole router: transparently, as a TUN interface, or as a plain
            SOCKS5 proxy. It is built on the Aether core by CluvexStudio, and
            comes with a Persian right-to-left LuCI page.

            ### OpenWrt

            Grab the `gozarbin-openwrt-<release>-<arch>.tar.gz` that matches your
            router and install both packages inside it. Twelve architectures,
            each in both formats: `24.10.x` is opkg, `25.12.x` is apk.

            ```sh
            # OpenWrt 25.12.x
            apk add --allow-untrusted ./gozarbin-*.apk ./luci-app-gozarbin-*.apk
            # OpenWrt 24.10.x
            opkg install ./gozarbin_*.ipk ./luci-app-gozarbin_*.ipk
            ```

            `aarch64_cortex-a53/a72/a76`, `aarch64_generic`,
            `arm_cortex-a5/a7/a8/a9/a15` (the vfp variants) and `x86_64`.
            MIPS, PowerPC and big-endian ARM are not built: Rust carries them
            as tier 3, so the core cannot be produced for them.

            Then open **Services -> Gozarbin** in LuCI. The packages pull in
            the nftables TProxy and socket modules, the TUN module and full
            iproute2, so a fresh router needs nothing installed by hand.

            - Three ways to run: transparent TProxy, a TUN interface, or SOCKS5 only.
            - Scans for a gateway that answers from inside Iran, and remembers the one that worked.
            - Live upload and download accounting, read from real nftables counters.
            - Iran IP ranges and sing-box GeoIP/GeoSite rule sets, from any URL you choose.
            - Never touches Passwall2: not its firewall rules, not its sing-box.

            ### Desktop

            The `aether-<platform>-<arch>` archives are the upstream standalone
            client for Linux and Windows. Run one and point a browser,
            terminal or system proxy at `127.0.0.1:1819`.

            Every archive ships with a matching `.sha256`, and `SHA256SUMS.txt`
            lists them all. See README.md for the full Persian guide.

  # ------------------------------------------------------------------
  # Build and push the Docker image to GitHub Container Registry (GHCR)
  # ------------------------------------------------------------------
  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker requires repository names to be strictly lowercase.
      # Since CluvexStudio contains uppercase, we lowercase it here.
      - name: Downcase repository name
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
